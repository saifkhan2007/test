<style>
:root{
  --void:#03040d; --navy:#071237; --navy2:#0d2275;
  --y:#fcee0a; --amber:#ffb800; --cyan:#00f0ff; --red:#ff003c;
  --ink:#ece9cf; --dim:#9aa3c7;
  --font:'Chakra Petch','Arial Narrow',Arial,sans-serif;
  --cut:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(125deg,#000 0%,var(--navy) 30%,var(--navy2) 52%,#1b1500 78%,#000 100%) 0 0/300% 300%;
  animation:drift 24s ease-in-out infinite alternate;
}
@keyframes drift{to{background-position:100% 100%}}

/* ---------- ambient layers ---------- */
#rain{position:fixed;inset:0;z-index:0;opacity:.22;pointer-events:none}
.floor{
  position:fixed;left:-60%;right:-60%;bottom:0;height:50vh;z-index:0;pointer-events:none;
  background:
    linear-gradient(rgba(252,238,10,.28) 1px,transparent 1px) 0 0/100% 56px,
    linear-gradient(90deg,rgba(252,238,10,.28) 1px,transparent 1px) 0 0/56px 100%;
  transform:perspective(420px) rotateX(64deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000,transparent 80%);mask-image:linear-gradient(to top,#000,transparent 80%);
  animation:floor 2.2s linear infinite;
}
@keyframes floor{to{background-position:0 56px,0 0}}
.scan{
  position:fixed;inset:0;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
}
.scan::after{
  content:"";position:absolute;left:0;right:0;height:14vh;top:-14vh;
  background:linear-gradient(transparent,rgba(252,238,10,.07),transparent);
  animation:bar 7s linear infinite;
}
@keyframes bar{to{top:100vh}}

/* ---------- boot sequence (the one big entrance) ---------- */
#boot{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center;animation:bootout .45s 1.7s forwards}
#boot div{width:min(340px,80vw)}
#boot p{font-weight:700;letter-spacing:.2em;color:var(--y);font-size:.85rem;margin-bottom:12px;animation:flick .5s steps(2) infinite}
#boot .bar{height:6px;background:rgba(252,238,10,.18);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#boot .bar i{display:block;height:100%;width:0;background:var(--y);box-shadow:0 0 12px var(--y);animation:load 1.5s cubic-bezier(.6,0,.3,1) forwards}
@keyframes load{to{width:100%}}
@keyframes bootout{to{opacity:0;visibility:hidden}}
@keyframes flick{50%{opacity:.55}}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 clamp(18px,4vw,40px) 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid rgba(252,238,10,.22)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.14em}
.brand b{background:var(--y);color:#000;padding:4px 12px 4px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);letter-spacing:.06em}
.status{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:#2dff87;box-shadow:0 0 10px #2dff87;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

.hero{padding:clamp(46px,9vw,100px) 0 40px}
.glitch{
  position:relative;display:inline-block;font-weight:700;line-height:.95;letter-spacing:.03em;
  font-size:clamp(3rem,13vw,8.5rem);color:var(--y);text-shadow:0 0 26px rgba(252,238,10,.4);
  animation:flicker 5s infinite 2.2s;
}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;mix-blend-mode:screen}
.glitch::before{color:var(--cyan);animation:g1 3.4s infinite steps(1) 2.2s}
.glitch::after{color:var(--red);animation:g2 3.4s infinite steps(1) 2.2s}
@keyframes g1{0%,88%,100%{clip-path:inset(0 0 100% 0);transform:none}
  89%{clip-path:inset(8% 0 62% 0);transform:translate(-6px,0)}
  92%{clip-path:inset(58% 0 14% 0);transform:translate(5px,0)}
  96%{clip-path:inset(30% 0 44% 0);transform:translate(-4px,0)}}
@keyframes g2{0%,88%,100%{clip-path:inset(0 0 100% 0);transform:none}
  90%{clip-path:inset(40% 0 38% 0);transform:translate(6px,0)}
  93%{clip-path:inset(12% 0 70% 0);transform:translate(-5px,0)}
  97%{clip-path:inset(66% 0 8% 0);transform:translate(4px,0)}}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.6}95%{opacity:1}96%{opacity:.75}}
.tw{margin-top:22px;min-height:1.6em;font-size:1.15rem;color:var(--amber);letter-spacing:.06em}
.tw::after{content:"";display:inline-block;width:.6em;height:1.05em;margin-left:5px;vertical-align:-.15em;background:var(--amber);animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
nav a{
  color:var(--ink);text-decoration:none;font-weight:600;letter-spacing:.08em;padding:9px 22px 9px 18px;
  background:rgba(252,238,10,.1);border-left:3px solid var(--y);
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:background .2s,color .2s,padding .2s;
}
nav a:hover,nav a:focus-visible{background:var(--y);color:#000;padding-right:30px;outline:none}

/* ---------- sections ---------- */
section{margin-top:70px;scroll-margin-top:20px}
.sh{display:flex;align-items:center;gap:18px}
.sh h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--y);text-shadow:0 0 16px rgba(252,238,10,.3)}
.sh .rule{flex:1;height:2px;background:linear-gradient(90deg,var(--y),rgba(252,238,10,0));position:relative;overflow:hidden}
.sh .rule::after{content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;background:#fff;opacity:.8;animation:run 3.2s linear infinite}
@keyframes run{to{left:110%}}
.blurb{margin:8px 0 26px;color:var(--dim);font-size:1.05rem}
ul.grid{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}

.cell{transition:filter .25s}
.cell:hover,.cell:focus-within{filter:drop-shadow(0 0 16px rgba(252,238,10,.55))}
.card{
  position:relative;display:flex;flex-direction:column;gap:10px;height:100%;min-height:170px;padding:24px 24px 20px 28px;
  color:var(--ink);text-decoration:none;overflow:hidden;
  background:linear-gradient(135deg,rgba(13,34,117,.78),rgba(3,4,13,.92));
  border:1px solid rgba(252,238,10,.28);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
  transition:background .25s,color .25s,transform .25s;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--y);box-shadow:0 0 14px var(--y);transition:width .25s,background .25s}
.card::after{
  content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);pointer-events:none;
}
.card:hover,.card:focus-visible{background:var(--y);color:#000;transform:translate(-3px,-3px);outline:none}
.card:hover::before,.card:focus-visible::before{background:#000;box-shadow:none;width:9px}
.card:hover::after,.card:focus-visible::after{animation:sweep .65s ease-out}
@keyframes sweep{to{left:130%}}
.card h3{font-size:1.55rem;font-weight:700;letter-spacing:.04em;line-height:1.1}
.card:hover h3{animation:jit .3s steps(2) 1}
@keyframes jit{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.card p{color:var(--dim);font-size:1.02rem;line-height:1.4;flex:1;transition:color .25s}
.card:hover p,.card:focus-visible p{color:#2a2500}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;font-weight:600;letter-spacing:.04em;color:var(--y);transition:color .25s}
.foot span:first-child{opacity:.75}
.card:hover .foot,.card:focus-visible .foot{color:#000}
.chev{display:inline-block;width:11px;height:11px;border-top:3px solid currentColor;border-right:3px solid currentColor;transform:rotate(45deg);margin-left:6px;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px) rotate(45deg)}}

.empty{
  grid-column:1/-1;padding:30px 28px;border:1px dashed rgba(252,238,10,.4);color:var(--dim);font-size:1.05rem;line-height:1.5;
  background:repeating-linear-gradient(135deg,rgba(252,238,10,.04) 0 12px,transparent 12px 24px);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);

.empty b{color:var(--amber);display:block;font-size:1.2rem;margin-bottom:4px;letter-spacing:.04em;animation:flick 2.4s steps(2) infinite}

/* ---------- ticker ---------- */
.ticker{position:fixed;left:0;right:0;bottom:0;z-index:30;overflow:hidden;background:var(--y);color:#000;font-weight:700;letter-spacing:.12em;padding:7px 0;white-space:nowrap}
.ticker div{display:inline-block;animation:tick 38s linear infinite}
.ticker span{margin:0 28px}
@keyframes tick{to{transform:translateX(-50%)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #boot{display:none}#rain{display:none}
}
</style>

<script>


/* ---------- build the page ---------- */
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

document.title = SITE.title;
$("title").textContent = SITE.title;
$("title").dataset.text = SITE.title;
$("brand").textContent = SITE.title;

SECTIONS.forEach(s => {
  $("nav").insertAdjacentHTML("beforeend", `<a href="#${s.id}">${s.title}</a>`);

  const cards = s.links.length
    ? s.links.map(l => `
        <li class="cell"><a class="card" href="${l.url}">
          <h3>${l.name}</h3>
          <p>${l.desc || ""}</p>
          <div class="foot"><span>${l.url}</span><span>Open<i class="chev"></i></span></div>
        </a></li>`).join("")
    : `<li class="empty"><b>Nothing here yet</b>Add a link to the <code>${s.id}</code> list in <code>index.html</code> and it shows up here.</li>`;

  $("sections").insertAdjacentHTML("beforeend", `
    <section id="${s.id}">
      <div class="sh"><h2>${s.title}</h2><span class="rule"></span></div>
      <p class="blurb">${s.blurb || ""}</p>
      <ul class="grid">${cards}</ul>
    </section>`);
});

/* ticker */
const tickText = ["NIGHT CITY ONLINE", ...SECTIONS.map(s => s.title.toUpperCase() + " " + s.links.length), "STAY SHARP, CHOOMBA"]
  .map(t => `<span>${t}</span>`).join("");
$("tick").innerHTML = tickText.repeat(6);

/* clock */
const tickClock = () => $("clock").textContent = "ONLINE  " + new Date().toLocaleTimeString([], {hour12:false});
tickClock(); setInterval(tickClock, 1000);

/* typewriter */
(function(){
  const el = $("tw"), lines = SITE.messages.map(m => "> " + m.toUpperCase());
  if (reduce) { el.textContent = lines[1] || lines[0]; return; }
  let li = 0, ci = 0, del = false;
  (function step(){
    const s = lines[li];
    ci += del ? -1 : 1;
    el.textContent = s.slice(0, ci);
    let t = del ? 22 : 55;
    if (!del && ci === s.length) { del = true; t = 1800; }
    else if (del && ci === 0) { del = false; li = (li + 1) % lines.length; t = 350; }
    setTimeout(step, t);
  })();
})();

/* falling code */
(function(){
  if (reduce) return;
  const c = $("rain"), x = c.getContext("2d"), chars = "01アイウエオカキクケコサシスセソ<>/#$%";
  let w, h, cols, drops;
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; cols = Math.ceil(w / 18); drops = Array.from({length: cols}, () => Math.random() * -40); };
  size(); addEventListener("resize", size);
  setInterval(() => {
    x.globalCompositeOperation = "destination-out";
    x.fillStyle = "rgba(0,0,0,.14)"; x.fillRect(0, 0, w, h);
    x.globalCompositeOperation = "source-over";
    x.font = "15px monospace";
    drops.forEach((d, i) => {
      x.fillStyle = Math.random() > .97 ? "#00f0ff" : "rgba(252,238,10,.8)";
      x.fillText(chars[Math.random() * chars.length | 0], i * 18, d * 18);
      if (d * 18 > h && Math.random() > .975) drops[i] = 0;
      drops[i] += .6;
    });
  }, 55);
})();
</script>
